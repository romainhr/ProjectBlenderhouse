# CI de cada PR y de main. Al fusionar en main (o al relanzarlo a mano sobre main) publica el sitio en Netlify:
# es el único camino de despliegue (CLAUDE.md, «Trabajo con git y GitHub»; docs/adr/0005-git-github-pipeline.md).
# Secretos del repositorio, que crea el usuario: NETLIFY_TOKEN, SUPABASE_URL y SUPABASE_CLAVE_PUBLICA (la clave
# publicable, pública por diseño con RLS; nunca la de servicio: web/build.py la rechaza).
# Las acciones van fijadas por SHA; la etiqueta del comentario es sólo referencia.
name: CI y despliegue

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # en una PR, un push nuevo cancela la corrida anterior; en main nunca se corta un despliegue a medias
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secretos:
    name: Sin secretos versionados
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prueba del buscador
        run: bash .github/scripts/test_buscar_secretos.sh
      - name: Buscar secretos en los archivos versionados
        run: bash .github/scripts/buscar-secretos.sh

  pruebas:
    name: Pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install -r .github/requirements-ci.txt
      - name: Node (web/tests/*.test.mjs)
        working-directory: web
        run: npm test
      - name: Python (web/tests/test_*.py)
        run: python3 -m unittest discover -s web/tests -p 'test_*.py'
      - name: Cadena de sellos del pipeline de Blender (sin Blender)
        run: python3 build/depto_medicion/test_sellos.py

  sql:
    name: Pruebas SQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - name: Supabase local (sólo Postgres, Auth y Storage, que usan las migraciones y las pruebas)
        run: |
          mkdir -p "$RUNNER_TEMP/supabase-ci"
          cd "$RUNNER_TEMP/supabase-ci"
          supabase init < /dev/null
          # la salida de start trae las claves de desarrollo local (públicas, iguales para todos): no se imprime
          if ! supabase start -x realtime,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
               > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            grep -viE 'key|secret|jwt' "$RUNNER_TEMP/supabase-start.log" | tail -n 40
            exit 1
          fi
          echo "SUPABASE_LOCAL_OK"
      - name: Migraciones y pruebas de web/supabase
        run: bash .github/scripts/pruebas-sql.sh

  sitio:
    name: Build del sitio
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_CLAVE_PUBLICA: ${{ secrets.SUPABASE_CLAVE_PUBLICA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - run: python3 -m pip install -r .github/requirements-ci.txt
      - name: Exigir los secretos de Supabase en main
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_CLAVE_PUBLICA" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL o SUPABASE_CLAVE_PUBLICA: el sitio publicado quedaría con las reservas desconectadas."
            exit 1
          fi
      - name: python3 web/build.py
        run: python3 web/build.py
      - name: Subir web/dist (vista previa descargable desde la corrida)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sitio-dist
          path: web/dist
          if-no-files-found: error
          # el almacenamiento de Actions es limitado: en main el artefacto sólo pasa al despliegue
          retention-days: ${{ github.ref == 'refs/heads/main' && 1 || 3 }}

  desplegar:
    name: Desplegar en Netlify
    needs: [secretos, pruebas, sql, sitio]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bajar el mismo web/dist que pasó el build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sitio-dist
          path: web/dist
      - name: python3 web/desplegar.py --sitio loft-2d2b
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          if [ -z "$NETLIFY_TOKEN" ]; then
            echo "::error::Falta el secreto NETLIFY_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          python3 web/desplegar.py --sitio loft-2d2b
